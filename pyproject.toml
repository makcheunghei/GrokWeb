[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grokweb-mcp"
version = "0.1.0"
description = "Local Grok Web and X search MCP using your Chrome session"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.26,<2",
  "browser-cookie3==0.20.1",
  "pycryptodomex>=3.20,<4",
  "curl-cffi>=0.14,<0.15",
  "certifi>=2025.1.31",
]

[project.scripts]
grokweb = "grokweb.__main__:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<0.16"]

[tool.hatch.build.targets.wheel]
packages = ["src/grokweb"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
